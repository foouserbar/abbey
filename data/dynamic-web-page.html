<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
  </head>
  <body>
      <script>
        const div = 1183;
        const min = Math.ceil(10000 / div);
        const max = Math.floor(99999999 / div);       
        const rnd = Math.floor(Math.random() * (max - min + 1) + min);
        document.innerText = `Random value is ${rnd * div}`;
      </script>
  </body>
</html>
