<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
  </head>
  <body>
      <p id="rnd">Random value is </p>
      <script>
        const div = 1745;
        const min = Math.ceil(10000 / div);
        const max = Math.floor(99999999 / div);       
        const rnd = Math.floor(Math.random() * (max - min + 1) + min);
        document.getElementById('rnd').innerHTML += rnd * div;
      </script>
  </body>
</html>
